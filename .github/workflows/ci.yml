name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --config.dangerouslyAllowAllBuilds=true
      - run: pnpm exec vite build

  windows-release:
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend
        run: pnpm install --config.dangerouslyAllowAllBuilds=true
      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.0
          releaseName: "星圖 Atlas v0.1.0"
          releaseBody: |
            ## 下載後怎麼用
            1. 安裝本頁 Assets 裡的 Windows 安裝包（.msi / .exe）
            2. PayPal 付 $0.99（cao417090217@gmail.com）
            3. 用 Transaction ID 在 https://ya-mic.github.io/ymz-atlas/redeem.html 生成兌換碼
            4. 打開軟體貼上訂單號啟用

            含：星雲圖 · 樹圖 · 等高線
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
