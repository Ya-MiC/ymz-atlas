[package]
name = "ymz-atlas"
version = "0.1.0"
description = "晏銘湛箴 · 星圖 Atlas — 本機資料星雲圖 / 樹圖 / 等高線"
authors = ["Ya-MiC <cao417090217@gmail.com>"]
edition = "2021"
license = "MIT"

[lib]
name = "ymz_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
