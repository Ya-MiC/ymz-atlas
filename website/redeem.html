<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>兌換碼 · 星圖 Atlas</title>
<style>
  :root { --bg:#191C29; --surface:#1E3029; --accent:#9FA98F; --ink:#E2E4ED; --muted:#9aa0b0; --on:#191C29; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    background:radial-gradient(900px 400px at 10% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent), var(--bg); color:var(--ink); }
  .card { width:min(480px,calc(100% - 32px)); background:var(--surface); border-radius:16px; padding:24px; border:1px solid #ffffff22; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); font-size:13px; line-height:1.6; }
  label { display:block; margin-top:14px; font-size:12px; color:var(--muted); }
  input { width:100%; margin-top:6px; box-sizing:border-box; padding:12px; border-radius:10px; border:1px solid #ffffff22; background:var(--bg); color:var(--ink); font-size:14px; }
  .out { margin-top:14px; padding:12px; border-radius:10px; background:var(--bg); word-break:break-all; font-family:Consolas,monospace; font-size:14px; min-height:24px; }
  .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  button, a.btn { min-height:44px; padding:0 16px; border-radius:999px; border:none; font-weight:650; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
  button { background:var(--accent); color:var(--on); }
  a.btn { background:transparent; color:var(--ink); border:1px solid #ffffff33; }
  .err { color:#e76f51; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>訂單號 → 兌換碼</h1>
    <p>付完 $0.99 後，打開 PayPal 收據，複製 <b>Transaction ID</b>，貼在下方。生成的 <code>ATLAS-…</code> 就是啟用碼，打開軟體貼上訂單號即可（兌換碼會自動算出）。</p>
    <label>PayPal Transaction ID / 訂單號
      <input id="txn" placeholder="例如 5AB12345678901234" />
    </label>
    <div class="out" id="out">ATLAS-————</div>
    <div class="err" id="err"></div>
    <div class="row">
      <button id="gen" type="button">生成兌換碼</button>
      <button id="copy" type="button">複製</button>
      <a class="btn" href="./">回官網</a>
      <a class="btn" href="https://github.com/Ya-MiC/ymz-atlas/releases">下載軟體</a>
    </div>
  </div>
<script>
const SECRET = "ymz.atlas.paypal.v1.yanmingzhanzhen.0.99";
function norm(s){ return s.trim().toUpperCase().replace(/[^A-Z0-9]/g,""); }
async function sha256Hex(msg){
  const dig = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
  return [...new Uint8Array(dig)].map(b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();
}
async function codeFromTxn(raw){
  const txn = norm(raw);
  if(txn.length<15 || txn.length>22) throw new Error("訂單號長度應為 15–22 位英數（PayPal Transaction ID）");
  const hex = (await sha256Hex(SECRET+"|"+txn)).slice(0,20);
  return `ATLAS-${hex.slice(0,4)}-${hex.slice(4,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}`;
}
const txn=document.getElementById("txn"), out=document.getElementById("out"), err=document.getElementById("err");
async function run(){
  err.textContent="";
  try{ out.textContent = await codeFromTxn(txn.value); }
  catch(e){ out.textContent="ATLAS-————"; err.textContent=e.message||String(e); }
}
document.getElementById("gen").onclick=run;
txn.addEventListener("change",run);
document.getElementById("copy").onclick=async()=>{
  if(!out.textContent.startsWith("ATLAS-")||out.textContent.includes("—")) return;
  await navigator.clipboard.writeText(out.textContent);
  err.textContent="已複製";
};
</script>
</body>
</html>
